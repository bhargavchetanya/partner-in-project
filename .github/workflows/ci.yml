name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start single-node replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --quiet --eval "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}" && break; sleep 2; done
          sleep 5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27018/pip-test?replicaSet=rs0&directConnection=true
      - run: npm run build
